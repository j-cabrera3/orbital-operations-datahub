stages:
  - lint
  - test
  - etl

lint_python:
  stage: lint
  tags:
    - local
    - windows
    - docker
  script:
    - pip install -r requirements-dev.txt
    - flake8 etl utils

test_python:
  stage: test
  tags:
    - local
    - windows
    - docker
  script:
    - pip install -r requirements-dev.txt
    - pytest

nasa_etl_job:
  stage: etl
  tags:
    - local
    - windows
    - docker
  script:
    - python -m etl.nasa_etl

spacex_etl_job:
  stage: etl
  tags:
    - local
    - windows
    - docker
  script:
    - python -m etl.spacex_etl
